<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bba3ff" />
      <stop offset="50%" stop-color="#885bf8" />
      <stop offset="100%" stop-color="#4e8cff" />
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5be5ff" />
      <stop offset="100%" stop-color="#735eff" />
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c9b8ff" />
      <stop offset="100%" stop-color="#7052ff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container badge -->
  <rect width="48" height="48" rx="14" fill="#090c1b" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" stroke="url(#g1)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Neural Hexagonal Orbit 1 -->
  <path d="M24 7L38 15.5V32.5L24 41L10 32.5V15.5L24 7Z" stroke="url(#g1)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inner Dynamic Spark Matrix -->
  <path d="M24 14L32 19V29L24 34L16 29V19L24 14Z" stroke="url(#g2)" stroke-width="1.8" stroke-dasharray="2 3" stroke-linecap="round" opacity="0.85" />

  <!-- Central Nexus Core -->
  <circle cx="24" cy="24" r="5.5" fill="url(#g1)" filter="url(#glow)" />
  <circle cx="24" cy="24" r="2.8" fill="#ffffff" />

  <!-- Key Synaptic Nodes -->
  <circle cx="24" cy="7" r="2" fill="#dcd4ff" />
  <circle cx="38" cy="15.5" r="2" fill="#71a9ff" />
  <circle cx="38" cy="32.5" r="2" fill="#bfa3ff" />
  <circle cx="24" cy="41" r="2" fill="#58d9ff" />
  <circle cx="10" cy="32.5" r="2" fill="#9070ff" />
  <circle cx="10" cy="15.5" r="2" fill="#c3b0ff" />
</svg>
